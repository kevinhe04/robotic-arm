[project]
name = "perception"
version = "0.1.0"
description = "Screen reading and answer selection for a 4-DOF touchscreen robot arm"
requires-python = ">=3.11"
# Deliberately thin. Python here is only the VLM call -- the servo bus, kinematics,
# motion and the application loop are C++ under driver/. Add an HTTP client and an
# image library when the VLM work starts.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perception"]

[tool.pytest.ini_options]
testpaths = ["perception"]

[tool.ruff]
line-length = 100
src = ["perception"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
